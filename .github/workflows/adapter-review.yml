name: Adapter Review

on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && contains(github.event.comment.body, '/review-adapter')
      && (
        github.event.comment.author_association == 'OWNER'
        || github.event.comment.author_association == 'MEMBER'
        || github.event.comment.author_association == 'COLLABORATOR'
        || github.event.comment.author_association == 'CONTRIBUTOR'
      )
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: harbor-index/adapter-automation/.github/workflows/adapter-review.yml@f2ebf9c297ca57d9b7ce8a046cef4a2e228ca2b2
    with:
      pr-number: ${{ github.event.issue.number }}
      automation-ref: f2ebf9c297ca57d9b7ce8a046cef4a2e228ca2b2
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
