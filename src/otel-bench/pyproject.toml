[project]
name = "harbor-otel-bench-adapter"
version = "0.1.0"
description = "Harbor adapter for OTelBench (OpenTelemetry instrumentation tasks)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
otel-bench = "otel_bench.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otel_bench"]
