jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false
environment:
  type: docker
  # type: daytona
  force_build: true
  delete: true
  # env:
  #   ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  #   ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
  #   DAYTONA_API_KEY: ${DAYTONA_API_KEY}
agents:
  - name: oracle
  # - name: claude-code
  #   model_name: anthropic/claude-haiku-5-5
datasets:
  - path: datasets/healthbench-professional
# Benchmark score: mean unclipped score, clipped to [0, 1] (metric.py needs uv);
# "mean" keeps Harbor's per-key means of reward and score.
metrics:
  - type: uv-script
    kwargs:
      script_path: src/healthbench-professional/src/healthbench_professional/metric.py
  - type: mean
