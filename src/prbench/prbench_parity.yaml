# The Harbor job config of the two reported parity runs (2026-11-21), as they ran
# (the same settings as config.yaml in the parity-experiments upload): Harbor
# 0.26.0, the judge set on the host with JUDGE_MODEL=gpt-5.6-terra (now the
# task.toml default). From the repository root:
#   uv run --project src/prbench prbench --split parity --output-dir datasets/parity200
#   export ANTHROPIC_API_KEY=... OPENAI_API_KEY=...   # and the two *_BASE_URL if not the vendors'
#   JUDGE_MODEL=gpt-5.6-terra uvx --from harbor==0.26.0 harbor run -c src/prbench/prbench_parity.yaml
# The verifier reads OPENAI_API_KEY / OPENAI_BASE_URL / JUDGE_MODEL from the host
# environment (task.toml [verifier.env]).
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 12
  quiet: false
environment:
  type: docker
  force_build: true
  delete: true
  env:
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
agents:
  - name: claude-code
    model_name: anthropic/claude-haiku-5-5
    kwargs:
      version: "2.1.322"  # the same Claude Code build on the original-benchmark side
datasets:
  - path: datasets/parity200
